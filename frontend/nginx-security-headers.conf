# Government Template Platform V3.0 — SPA-ийн аюулгүй байдлын толгой.
#
# ЭНЭ ФАЙЛЫГ `location` бүрээс `include` хийнэ. Шалтгаан: nginx-ийн `add_header`
# нь ӨВЛӨГДДӨГГҮЙ — дотоод блокт нэг ч `add_header` байвал гадна талын БҮХ
# толгой тэр блокт хүчингүй болно. Нэг эх сурвалжаас include хийснээр "нэг
# location дээр нэмээд нөгөөд нь мартах" гэсэн чимээгүй алдаа боломжгүй болно.
#
# Утгууд нь эх (Go/Next.js) хувилбарын `next.config.mjs` → `headers()`-тэй 1:1.
# CSP-ийн шийдвэрүүд:
#   • script-src 'unsafe-inline' — /theme-bootstrap.js-ийн блоклогч inline хэсэг
#     ба bundler-ийн inline bootstrap-д шаардлагатай (эх хувилбартай ижил).
#     Nonce руу шилжих нь дараагийн сайжруулалт.
#   • style-src 'unsafe-inline' — апп нь React-ийн `style=` inline attribute
#     өргөн ашигладаг.
#   • img-src googleusercontent/gstatic — холбогдсон Google account-ийн профайл
#     зураг ба Drive файлын icon browser-т ШУУД ачаалагддаг.
#   • font-src 'self' — фонтууд bundle дотор өөрөө host хийгддэг (fontsource);
#     гуравдагч талын фонт хост руу ХЭЗЭЭ Ч хандахгүй (хэрэглэгчийн IP гадагш
#     алдагдахгүй).
#   • connect-src 'self' — browser зөвхөн ижил origin дахь /api/v1/* рүү.
#   • frame-src — Drive/Dropbox-ийн preview iframe нь провайдерын интерактив
#     хуудас тул сервэрээр дамжуулах боломжгүй (тэд proxied origin-оос
#     framing-ийг татгалздаг). Интеграц тохируулаагүй үед эдгээр хост руу хэзээ ч
#     хандахгүй — боломж нь inert.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'self' https://drive.google.com https://docs.google.com https://*.dropboxusercontent.com https://www.dropbox.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# microphone=(self) — AI туслахын дуут оролт ба амьд орчуулга нь getUserMedia
# ашигладаг. camera/geolocation хэрэггүй тул хаалттай.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
