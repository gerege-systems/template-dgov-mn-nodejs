# Government Template Platform V3.0 — SPA контейнерийн nginx.
#
# ЗӨВХӨН статик файл үйлчилнэ: `/api/*`-ыг ГАДНАХ (host) nginx api контейнер
# руу проксилдог тул энд backend руу ямар ч зам НЭЭГДЭХГҮЙ (least surface).
#
# ⚠️ АЮУЛГҮЙ БАЙДЛЫН ТОЛГОЙ ЭНД БАЙХ ЁСТОЙ. Next.js хувилбарт тэдгээрийг
# `next.config.mjs`-ийн `headers()` тавьдаг байсан; BFF алга болоход тэр давхарга
# мөн алга болж, документын (HTML) хариу толгойгүй үлдсэн. API-ийн толгойг
# backend өөрөө тавьдаг (`securityHeadersMiddleware`) — тэр нь ӨӨР хариу бөгөөд
# энэ файлыг ОРЛОХГҮЙ.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Аюулгүй байдлын толгой (эх хувилбарын next.config.mjs-тэй 1:1) ──
    #
    # `always` нь 4xx/5xx хариунд ч толгойг тавина — алдааны хуудас толгойгүй
    # үлдэх нь довтолгооны гадаргуу болно.
    #
    # ⚠️ nginx-ийн `add_header` нь ӨВЛӨГДДӨГГҮЙ: аль нэг `location` дотор
    # `add_header` дуудвал тэр блок дахь server-түвшний БҮХ толгойг дардаг.
    # Тиймээс доорх location бүр аюулгүй байдлын толгойг `include`-ээр дахин
    # оруулна — эс бөгөөс `/assets/` ба SPA fallback (өөрөөр хэлбэл БҮХ HTML)
    # CSP-гүй үлдэнэ.
    include /etc/nginx/snippets/security-headers.conf;

    # Контейнерийн healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ── Apple App Site Association (iOS Universal Links) ──
    # eID App2App буцалт (/auth/eid/callback) утсанд суусан апп руу шууд орохын
    # тулд iOS энэ файлыг ЯГ ЭНЭ замаас, `application/json` төрлөөр татдаг.
    # SPA fallback-д (try_files … /index.html) орвол HTML буцаж, Universal Link
    # ЧИМЭЭГҮЙ ажиллахаа болино — тиймээс fallback-аас ӨМНӨ ил зарлана.
    # Өргөтгөлгүй файл тул content-type-ыг гараар тавина.
    location = /.well-known/apple-app-site-association {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Хэш-тэй асет — урт кэш (файлын нэр өөрчлөгдвөл шинэ URL).
    # Фонтын woff2 файлууд ч энд багтана.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # SPA fallback: клиент талын маршрут бүр index.html-ээр эхэлнэ.
    # index.html-ийг кэшлэхгүй — эс бөгөөс хуучин багц шинэ асет хайж эвдэрнэ.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
