# Government Template Platform V3.0 — Node.js edition
# CI хаалгууд — push (main) болон бүх PR дээр ажиллана. Backend (prettier · eslint ·
# vitest · openapi drift · tsc build · integration compile), frontend (lint · build ·
# test), нууц түлхүүрийн скан (gitleaks). Локал дээр `npm run pre-push` (backend/)
# энэ багцыг тольдоно.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # prettier — форматлагдаагүй файл байвал CI унана (gofmt gate-ийн эквивалент).
      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # OpenAPI drift — route/DTO өөрчлөгдсөн бол openapi.json дахин үүсгэж commit
      # хийсэн эсэхийг шалгана (swag drift gate-ийн эквивалент).
      - name: OpenAPI drift
        run: npm run openapi -- --check

      - name: Build
        run: npm run build

      # ESM smoke — build хийсэн модуль БҮРИЙГ жинхэнэ Node ESM loader-ээр
      # импортолж үзнэ. tsc болон vitest хоёулаа CommonJS хамаарлыг өөрсдийн
      # interop-оор шийддэг тул `import { x } from '<cjs-pkg>'` тэдгээрт
      # амжилттай хэвээр, гэтэл production-д АЖИЛЛАХ ҮЕД унадаг (ssh2 яг ингэж
      # deploy унагасан). Энэ алхам тэр ангиллын алдааг CI-д барина.
      - name: ESM import smoke
        run: npm run smoke:esm

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action нь organization-ийн repo-д ТӨЛБӨРТЭЙ лиценз шаарддаг тул
      # түүний оронд гүйцэтгэх файлыг шууд татаж ажиллуулна (Apache-2.0, үнэгүй).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
