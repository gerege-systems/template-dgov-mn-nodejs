# Government Template Platform V3.0 — Node.js edition
# gitleaks тохиргоо — default дүрмүүд дээр нэмэлт allowlist. Энд зөвхөн жинхэнэ
# нууц БИШ, тестийн жишээ (dummy) утгуудыг зөвшөөрнө.
#
# ЭНД `[allowlist]` (нэгтгэл) хэлбэрийг хэрэглэв — CI-д тогтоосон gitleaks
# хувилбар (8.21.x) нь `[[allowlists]]` (олон тоо) хэлбэрийг ХҮЛЭЭН АВДАГГҮЙ
# бөгөөд түүнийг чимээгүй үл хэрэгсдэг тул allowlist ажиллахгүй байв.
[extend]
useDefault = true

[allowlist]
description = """
Unit тестийн жишээ (dummy) утгууд. jwt.test.ts дахь secret нь HS256-ийн 32
тэмдэгтийн шалгалтыг давахын тулд урт байх ЁСТОЙ тул generic-api-key дүрэмд
өртдөг; config.test.ts дахь dummy DSN/secret ч мөн адил. Аль нь ч жинхэнэ нууц биш.
"""
regexes = [
  '''test-secret-that-is-at-least-32-characters-long''',
  # base64("not-encrypted-at-all") — integrations-ийн тестийн фикстур: GCM нь
  # шифрлэгдээгүй өгөгдлийг татгалзахыг батлана. Түүхэнд (commit 1560d02)
  # литералаар үлдсэн тул энд зөвшөөрнө; кодод нь тооцоолсон утга болгож зассан.
  '''bm90LWVuY3J5cHRlZC1hdC1hbGw=''',
]
paths = [
  '''backend/src/pkg/jwt/jwt\.test\.ts''',
  '''backend/src/config/config\.test\.ts''',
  # secrethash.test.ts нь Go/Ory Hydra-гаас гаргасан ЭТАЛОН hash векторуудыг
  # агуулна (шилжилтийн байт-нийцлийг батлах зорилготой). Эдгээр нь нээлттэй
  # тестийн утгууд бөгөөд hash тул задлагдахгүй — гэхдээ энтропи өндөр тул
  # generic-api-key дүрэмд өртөнө.
  '''backend/src/pkg/secrethash/secrethash\.test\.ts''',
]

