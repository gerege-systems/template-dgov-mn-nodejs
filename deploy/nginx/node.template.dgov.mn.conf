# Government Template Platform V3.0 — Node.js edition (node.template.dgov.mn)
#
# `/` нь Vite + React SPA-г үйлчилдэг `web` контейнер руу (статик файл + SPA
# fallback) проксилно. Токен нь httpOnly cookie-д тул SPA болон API нь ИЖИЛ
# origin дээр байх ёстой — тиймээс энэ нэг server блок хоёуланг нь холбоно.
#
# Энэ бол ажиллаж байгаа серверээс хуулбарласан БОДИТ хувилбар (reproducible
# байхын тулд repo-д хадгалав). Шинэ сервер босгох:
#   cp deploy/nginx/node.template.dgov.mn.conf /etc/nginx/sites-available/node.template.dgov.mn
#   ln -s ../sites-available/node.template.dgov.mn /etc/nginx/sites-enabled/
#   cp deploy/www/index.html /var/www/node.template.dgov.mn/
#   certbot --nginx -d node.template.dgov.mn --redirect
# `# managed by Certbot` мөрүүдийг certbot өөрөө нэмдэг тул гараар бичих
# шаардлагагүй.
upstream node_tpl_api { server 127.0.0.1:8085; }
# WEB_PORT нь орчноос хамаарна — deploy.sh нь энэ портыг .env-ийн бодит
# утгаар сольж суулгадаг (repo дахь энэ файл нь өгөгдмөл 3007-г агуулна).
upstream node_tpl_web { server 127.0.0.1:3007; }

server {
    server_name node.template.dgov.mn;

    root /var/www/node.template.dgov.mn;
    index index.html;

    # Операторын endpoint-уудыг НИЙТЭД гаргахгүй. Контейнер нь
    # ENVIRONMENT=development-ээр ажилладаг (дотоод DB-д TLS байхгүй) тул апп
    # дотрох observability gate НЭЭЛТТЭЙ байна — иймээс proxy давхаргад хатуу
    # хаана (гүн хамгаалалт).
    location /metrics { deny all; return 404; }
    location /swagger { deny all; return 404; }

    # 3 дагч RP-уудын eID sign relay → api
    location /rp/sign/ {
        proxy_pass http://node_tpl_api;
        include /etc/nginx/proxy_params;
    }

    # Бэлэн болсон API гадаргуу
    location /api/v1/ {
        proxy_pass http://node_tpl_api;
        include /etc/nginx/proxy_params;
    }

    # ── OAuth2/OIDC provider-ийн СТАНДАРТ замууд ───────────────────────────
    # Эдгээр нь /api/v1-ээс ГАДУУР, үндэс дээр амьдардаг: замыг OIDC спекц
    # (`/.well-known/*`) болон RP-үүдийн тохиргоо тогтоодог тул апп өөрчилж
    # болохгүй. Иймд nginx-д ил жагсаана — эс бөгөөс `location /` (статик)
    # тэднийг залгиж, RP-үүд discovery-г HTML болгож уншина.
    location /oauth2/ {
        proxy_pass http://node_tpl_api;
        include /etc/nginx/proxy_params;
    }

    location = /userinfo {
        proxy_pass http://node_tpl_api;
        include /etc/nginx/proxy_params;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://node_tpl_api;
        include /etc/nginx/proxy_params;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://node_tpl_api;
        include /etc/nginx/proxy_params;
    }

    location = /health {
        proxy_pass http://node_tpl_api;
        include /etc/nginx/proxy_params;
    }

    location = /ready {
        proxy_pass http://node_tpl_api;
        include /etc/nginx/proxy_params;
    }

    # SPA — статик файл ба клиент талын маршрутын fallback (web контейнер).
    location / {
        proxy_pass http://node_tpl_web;
        include /etc/nginx/proxy_params;
    }

    listen 443 ssl; # managed by Certbot

    # HSTS — TLS энд терминалддаг тул энэ давхаргын хариуцлага.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/node.template.dgov.mn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/node.template.dgov.mn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = node.template.dgov.mn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name node.template.dgov.mn;
    return 404; # managed by Certbot


}